services:
  backend:
    build:
      context: ./backend
    ports:
      - "8800:8000"
      # Minecraft processes run inside this container's network namespace.
      # Publish a configurable range so each instance can use the manually
      # chosen `server-port` from its own server.properties file.
      - "${MARCHITECT_MINECRAFT_PORT_RANGE:-25565-25665}:${MARCHITECT_MINECRAFT_PORT_RANGE:-25565-25665}"
    volumes:
      - ./backend:/app
      # 서버 JAR·월드·로그는 코드와 분리된 호스트 폴더에 영구 보관합니다.
      - ./data:/data
      - ./backend/JAVA:/java
    environment:
      # New installations must define this in the local .env file.
      MARCHITECT_INITIAL_ADMIN_CODE: ${MARCHITECT_INITIAL_ADMIN_CODE:?Copy .env.example to .env and set an administrator code.}
      MARCHITECT_INITIAL_USER_CODE: ${MARCHITECT_INITIAL_USER_CODE:-}
      MARCHITECT_JAVA_ROOTS: /java
      MARCHITECT_JAVA_INSTALL_DIR: /java
      MARCHITECT_DEFAULT_JAVA_PATH: /java/21/bin/java
      MARCHITECT_INSTANCE_DIR: /data/instances
      MARCHITECT_AUTH_DB: /data/marchitect.sqlite3
      MARCHITECT_UID: ${MARCHITECT_UID:-1000}
      MARCHITECT_GID: ${MARCHITECT_GID:-1000}
      PYTHONDONTWRITEBYTECODE: "1"

  frontend:
    build:
      context: ./frontend
    ports:
      - "${MARCHITECT_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
