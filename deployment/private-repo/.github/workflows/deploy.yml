name: Deploy MArchitect

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    # Register the LAN runner ONLY to this private control repository.
    if: github.event.repository.private && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, marchitect-deploy]
    timeout-minutes: 30
    concurrency:
      group: marchitect-production
      cancel-in-progress: false
    steps:
      - name: Find the current master commit with a successful push CI run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = "AetrKD/MArchitect"
          def get(endpoint):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{endpoint}",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          sha = get("branches/master")["commit"]["sha"]
          runs = get(f"actions/workflows/ci.yml/runs?head_sha={sha}&event=push&per_page=5")["workflow_runs"]
          ready = bool(runs and runs[0]["head_sha"] == sha
                       and runs[0]["event"] == "push"
                       and runs[0]["head_branch"] == "master"
                       and runs[0]["status"] == "completed"
                       and runs[0]["conclusion"] == "success")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={sha}\nready={str(ready).lower()}\n")
          print(f"master {sha}: " + ("CI passed" if ready else "waiting for successful CI"))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.candidate.outputs.ready == 'true'
        with:
          repository: AetrKD/MArchitect
          ref: ${{ steps.candidate.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Deploy the checked commit over SSH
        if: steps.candidate.outputs.ready == 'true'
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
        run: bash scripts/ci-deploy.sh
